<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Report</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTUiIGZpbGw9IiM0ZjQ2ZTUiLz48dGV4dCB4PSIzMiIgeT0iNDUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iNDAiIGZvbnQtZmFtaWx5PSJBcHBsZSBDb2xvciBFbW9qaSxTZWdvZSBVSSBFbW9qaSxOb3RvIENvbG9yIEVtb2ppLHNhbnMtc2VyaWYiPvCfk4U8L3RleHQ+PC9zdmc+">
<link rel="stylesheet" href="dashboard.css"></head><body><div class="wrap">
<div class="top"><h1>📅 Daily Report</h1><div id="tabs" class="top" style="margin:0"></div><span id="st"></span>
 <details class="menu"><summary>Файл ▾</summary><div class="dd">
  <button data-a="xc">⬇ Excel — цей аркуш</button><button data-a="xa">⬇ Excel — усі вкладки + річні дані</button><button data-a="xi">⬆ Імпорт / відновлення з Excel</button>
  <button data-a="jb">💾 Резервна копія (json)</button><button data-a="jr">↺ Відновити з копії</button></div></details></div>
<div class="card"><div class="bar">
 <label>Назва<input id="sn"></label><label>Перший день<input id="ss" type="date"></label><label>Кількість днів<input id="sd" type="number" min="1" max="366" style="width:90px"></label><label>Ціль, дзвінків на тиждень<input id="swk" type="number" min="1" style="width:120px"></label>
 <button data-a="addw">+ тиждень</button><button data-a="adv" style="margin-left:auto">⚙ Структура</button></div>
 <div class="bar" id="adv"><label>Ticks на день<input id="stk" type="number" min="1" max="60" style="width:90px"></label><label>Розділи (через кому)<input id="ssec" style="width:280px"></label><label>Бренди (через кому)<input id="sbr" style="width:200px"></label><button data-a="dels" style="margin-left:auto;color:var(--bad)">Видалити поточний аркуш…</button></div></div>
<div class="stats" id="stats"></div>
<div class="card"><div id="strip"></div></div>
<div class="card" id="detail"></div>
<div class="card"><div style="font-weight:700;margin-bottom:6px">Активність дзвінків</div><div id="chart"></div>
 <div class="lg"><span><i style="background:#16a34a"></i>ціль дня виконано</span><span><i style="background:#eab308"></i>70–99%</span><span><i style="background:#f97316"></i>40–69%</span><span><i style="background:#ef4444"></i>менше 40%</span><span><i style="background:#38bdf8"></i>тренд (7 днів)</span><span>┄ ціль дня (тижнева ціль ÷ 5 робочих днів)</span><span>● під графіком: навантаження</span></div></div>
<div class="card weekday-card" id="weekday-monthly" aria-label="Ефективність за днями тижня"></div>
<input type="file" id="fx" accept=".xlsx" hidden><input type="file" id="fj" accept=".json" hidden></div>
<div id="sheet-manager" class="sheet-overlay h" aria-hidden="true">
 <div class="sheet-dialog" role="dialog" aria-modal="true" aria-labelledby="sheet-dialog-title">
  <div class="sheet-dialog-head"><h2 id="sheet-dialog-title">Керування аркушами</h2><button type="button" data-manage="close" aria-label="Закрити">×</button></div>
  <div id="sheet-dialog-body"></div>
 </div>
</div>
<script src="mini-exceljs.js"></script>
<script src="dashboard-bootstrap.js"></script></body></html>
